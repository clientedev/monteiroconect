services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://wa_central:wa_central_pass@postgres:5432/wa_central
      - JWT_SECRET=${JWT_SECRET:-change-me-production}
      - JWT_EXPIRES_IN=24h
      - SESSIONS_PATH=/app/sessions
      - UPLOAD_PATH=/app/uploads
      - LOG_PATH=/app/logs
      - CORS_ORIGIN=http://localhost
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@2026!}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@wa-central.local}
    volumes:
      - sessions_data:/app/sessions
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wa_central
      POSTGRES_PASSWORD: wa_central_pass
      POSTGRES_DB: wa_central
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa_central"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  sessions_data:
  uploads_data:
  logs_data:
